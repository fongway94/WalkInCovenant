<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- WalkInCovenant emblem: a lamp on the road.
       Psalm 119:105 — "Thy word is a lamp unto my feet, and a light unto my path."
       Palette inherited from Covenant: indigo-teal ground, warm gold accent. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="46%">
      <stop offset="0%" stop-color="#f7dda5" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#c9a45c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9a45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="#14202a"/>
  <rect x="6" y="6" width="116" height="116" rx="19" fill="#1b2a33"/>
  <circle cx="64" cy="50" r="46" fill="url(#glow)"/>

  <!-- the road, receding -->
  <path d="M40 112 L58 62 L70 62 L88 112 Z" fill="#24363f"/>
  <path d="M62 108 L63.4 74 L64.6 74 L66 108 Z" fill="#c9a45c" opacity="0.35"/>

  <!-- the lamp -->
  <g stroke="#c9a45c" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M64 24 L64 34"/>
    <path d="M52 40 Q64 30 76 40"/>
  </g>
  <path d="M50 42 h28 l-4 18 h-20 Z" fill="#c9a45c"/>
  <path d="M56 46 h16 l-2.5 11 h-11 Z" fill="#f7dda5"/>

  <!-- flame -->
  <path d="M64 34 q6 8 0 14 q-6 -6 0 -14 Z" fill="#f7dda5"/>
</svg>
