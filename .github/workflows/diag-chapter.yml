# TEMPORARY diagnostic: run the chapter suites without `bash -e` so a failing
# suite cannot abort the loop before its log is published.
name: diag-chapter

on:
  push:
    branches: [arena/278e59c4-walkincovenant]

permissions:
  contents: read

jobs:
  diag:
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot into place
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
      - name: Import
        run: |
          set +e
          timeout 600 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import > import.txt 2>&1
          tail -3 import.txt
      - name: Run painted_world and publish everything
        run: |
          set +e
          XDG_DATA_HOME="$RUNNER_TEMP/wic/d1" timeout 240 \
            /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . res://tests/painted_world.tscn > pw.txt 2>&1
          echo "exit=$?"
          wc -l pw.txt
          grep -aE 'FAIL|checks,|SCRIPT ERROR|ERROR|Parse Error' pw.txt | head -20 | cut -c-280 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          tail -14 pw.txt | cut -c-280 | while IFS= read -r line; do printf '::warning::%s\n' "$line"; done
