# One-shot relay of the already-tested prototype export into the sandbox.
# This is not a deployment and does not update GitHub Pages. The resulting
# unreferenced Git blob is temporary transport, not a committed build artifact.
name: temporary-preview-relay

on:
  push:
    branches: ['arena/905f79d4-walkincovenant']

jobs:
  relay:
    if: contains(github.event.head_commit.message, '[preview-relay-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the tested export from the successful review run
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web
          run-id: 42961472919
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Relay the export as an unreferenced Git blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          with zipfile.ZipFile('preview-export.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for root, dirs, files in os.walk('web'):
                  dirs.sort()
                  for name in sorted(files):
                      source = os.path.join(root, name)
                      archive.write(source, os.path.relpath(source, 'web'))
          data = open('preview-export.zip', 'rb').read()
          with open('payload.json', 'w') as f:
              json.dump({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}, f)
          with open('digest.txt', 'w') as f:
              f.write('%s|%d' % (hashlib.sha256(data).hexdigest(), len(data)))
          PY
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input payload.json > blob.json 2> relay-error.txt; then
            printf '::error::Preview relay failed: %s\n' "$(head -c 1000 relay-error.txt)"
            exit 1
          fi
          SHA=$(python3 -c 'import json; print(json.load(open("blob.json"))["sha"])')
          echo "::notice::PREVIEW_RELAY|${SHA}|$(cat digest.txt)"
