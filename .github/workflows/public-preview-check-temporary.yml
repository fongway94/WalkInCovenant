# One-shot public-URL validation for the isolated shepherd field. This job does
# not publish or update Pages and is removed after the preview is checked.
name: temporary-public-preview-check

on:
  push:
    branches: ['arena/905f79d4-walkincovenant']

jobs:
  check:
    if: contains(github.event.head_commit.message, '[check-public-preview-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/wic-public --no-audit --no-fund playwright pngjs
          /tmp/wic-public/node_modules/.bin/playwright install --with-deps chromium
      - name: Test the real public preview URL
        env:
          NODE_PATH: /tmp/wic-public/node_modules
          PUBLIC_PREVIEW_URL: https://htmlpreview.github.io/?https://github.com/${{ github.repository }}/blob/${{ github.sha }}/tools/proto/public_preview.html
        run: |
          set +e
          node tests/proto/public_preview.cjs > public-preview-result.txt 2>&1
          STATUS=$?
          cat public-preview-result.txt
          OUTPUT=$(tail -c 2500 public-preview-result.txt | tr '\n' '|')
          if [ "$STATUS" -eq 0 ]; then
            echo "::notice::${OUTPUT}"
          else
            echo "::error::${OUTPUT}"
          fi
          exit "$STATUS"
