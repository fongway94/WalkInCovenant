# Build the web export on every push and publish it to GitHub Pages.
#
# WHY THIS EXISTS: the sandbox that authors this project cannot run Godot
# (release binaries live on a host outside its network). GitHub Actions can.
# So packaging is not a manual step someone forgets — it happens on push, and
# the result is one URL / one QR code that plays in a browser and, after first
# load, works fully offline via the service worker (see tools/inject_pwa.py).
#
# This is the replacement for Covenant's single-file Covenant-offline.html.
# A WASM build cannot be one double-clickable file (browsers refuse file://
# for module + .pck loads), so the "one artifact anyone can open" property is
# delivered as: one URL, installable, offline-capable. See docs/PACKAGING.md.
#
# SHELL NOTE: container jobs run under /bin/sh, which is dash in this image —
# no `set -o pipefail`, no bash arrays. Every step below is POSIX. Both apk and
# apt-get are handled because the godot-ci image base has changed over time.

name: build-web

on:
  push:
    # `main` is the published game. `arena/**` is a working branch off it — the
    # automatic tooling gives each session a fresh branch name, so listing one
    # name meant the audit's own pushes ran no build at all and every gate in
    # docs/BUGS.md would have been reported from a commit CI never saw. Every
    # branch builds; `main` and the preview branch listed in the `deploy` job
    # also publish. The live URL is how the game is playtested before a merge.
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish the working-branch build to GitHub Pages (requires explicit approval)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  EXPORT_PRESET: Web

jobs:
  # ── content lint: the world data must be valid before we build it ────────
  lint:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Export templates into place
        run: |
          # The image has moved its template directory between releases, and a
          # missing template dir surfaces only as a vague "configuration
          # errors" at export time. So search the usual locations, link
          # whatever is there, and report exactly what was found.
          TARGET="$HOME/.local/share/godot/export_templates"
          mkdir -p "$TARGET"
          for SRC in /root/.local/share/godot/export_templates \
                     /usr/local/share/godot/export_templates \
                     /opt/godot/export_templates \
                     /home/runner/.local/share/godot/export_templates; do
            [ -d "$SRC" ] || continue
            for V in "$SRC"/*; do
              [ -d "$V" ] || continue
              N=$(basename "$V")
              if [ ! -e "$TARGET/$N" ]; then
                ln -s "$V" "$TARGET/$N" 2>/dev/null || cp -r "$V" "$TARGET/$N" || true
              fi
            done
          done
          echo "::notice::godot version: $(godot --version 2>/dev/null | head -1)"
          echo "::notice::template dirs: $(ls "$TARGET" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::web template files: $(ls "$TARGET/${GODOT_VERSION}.stable" 2>/dev/null | grep -c web || echo 0)"

      - name: Install build deps (fontconfig for Godot, python3 for tools)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache fontconfig ttf-dejavu python3 || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq || true
            apt-get install -y -qq --no-install-recommends \
              fontconfig python3 || true
          fi
          echo "python3: $(command -v python3 || echo MISSING)"

      # All four static tools in one step, with the whole output published as a
      # single joined annotation. Separate steps meant a failing tool's output
      # was only in the raw log, which this project's authoring sandbox cannot
      # reach — so a failure in CI was undiagnosable. One annotation of 3000
      # characters cannot be crowded out by GitHub's ~10-per-run cap.
      - name: Static checks (gd_lint, check_export, xref_check, api_check, check_font, check_audio, check_chars, check_faces, pack_art)
        id: static
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::python3 unavailable, static checks skipped"
            exit 0
          fi
          # check_faces is deliberately stdlib-only: the lint container has no
          # pip, and a gate that cannot run in CI must not be skipped silently.
          : > static.txt
          for T in gd_lint check_export xref_check api_check check_font check_audio check_chars check_faces check_art_reset; do
            echo "===== $T =====" >> static.txt
            python3 "tools/$T.py" >> static.txt 2>&1
            echo "exit=$?" >> static.txt
          done
          # pack_art also needs Pillow. It is installed above for check_faces;
          # keep the explicit guard so a worker without a wheel reports WHY
          # instead of failing the whole lint job with a traceback.
          echo "===== pack_art =====" >> static.txt
          if python3 -c "import PIL" 2>/dev/null; then
            python3 tools/pack_art.py --check >> static.txt 2>&1
            echo "exit=$?" >> static.txt
          else
            echo "skip: Pillow not installed on this runner (art is committed, layout is verified locally)" >> static.txt
            echo "exit=0" >> static.txt
          fi
          cat static.txt
          if grep -q "^exit=[^0]" static.txt; then
            exit 1
          fi

      - name: Publish static check output as one annotation
        if: always()
        run: |
          [ -f static.txt ] || exit 0
          tr '\n' '|' < static.txt | cut -c1-3000 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done

      - name: Fail the job if a static check failed
        if: steps.static.outcome != 'success'
        run: |
          echo "a static check failed"
          exit 1

      - name: Import resources and build the global class cache
        run: |
          # --import does a full headless import and exits; --editor --quit can
          # bail during the first filesystem scan, leaving
          # .godot/global_script_class_cache.cfg unwritten. Without that cache a
          # class_name cannot be resolved from another script, which surfaces as
          # "Could not resolve external class member" in an unrelated file.
          godot --headless --import || godot --headless --editor --quit || true
          if [ -f .godot/global_script_class_cache.cfg ]; then
            echo "::notice::global class cache present ($(grep -c '"class":' .godot/global_script_class_cache.cfg 2>/dev/null || echo 0) entries)"
          else
            echo "::warning::global_script_class_cache.cfg was not written"
          fi

      # Boots the real project headless: autoloads registered, global classes
      # resolved, main scene instantiated. A per-file --check-only run cannot do
      # this, and drowned in cascade errors from unregistered autoloads.
      - name: Parse-check each script individually (names the file that fails)
        run: sh tools/ci_parsecheck.sh

      - name: Boot the project headless (parse + smoke check)
        run: sh tools/ci_bootcheck.sh 10

      - name: Content lint (regions, reachability, bilingual)
        id: lint
        continue-on-error: true
        run: |
          # POSIX sh only: no `set -o pipefail`. Capture, print, then propagate
          # Godot's own exit code so a failed lint still gates the build.
          godot --headless --path . --script tests/run_all.gd > lint.txt 2>&1
          STATUS=$?
          cat lint.txt
          exit $STATUS

      # The gates above prove the project COMPILES and the content is well
      # formed. Neither proves the game can be PLAYED: Godot packs unparseable
      # scripts and still exits 0, and a region file can be valid while the loop
      # through it is broken. This boots Main.tscn and plays the slice — briefing,
      # four conversations, crossing the line empty-handed, five stones, BECOME,
      # five rounds of the word battle, RETURN, and the revisit — then asserts the
      # save state it left behind. It exists because two bugs reached this repo
      # that no compile-time gate could see: Region never built its trigger list
      # (the fight was unreachable by walking), and DialogueBox._pick() advanced a
      # box its own callback had just replaced (every single-line follow-up was
      # skipped). If a future change breaks the loop again, the build goes red
      # instead of somebody's first playtest.
      - name: Play the slice headless (integration smoke test)
        id: smoke
        continue-on-error: true
        run: |
          # Booted as a SCENE, not --script: Main::start() builds a --script main
          # loop long before it registers autoloads, so on that path this test and
          # every script it pulls in die with "Identifier not found: GameState".
          # A scene on the command line loads after the autoloads exist, which is
          # also how the shipped game boots.
          #
          # `timeout` is a backstop, not a nicety. A scene-booted test that never
          # reaches its quit() — a script that failed to compile, a dialogue box
          # that never closes — would otherwise run to the job's 6-hour limit.
          timeout 300 godot --headless --path . res://tests/smoke.tscn > smoke.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 124 ]; then
            echo "smoke: TIMEOUT — the playthrough never reached its final assertion" >> smoke.txt
          fi
          cat smoke.txt
          exit $STATUS

      # The regression suite. `smoke` proves the happy path still closes; this
      # proves the SECOND one is safe — a save reloaded, a transition
      # interrupted, a scene finished on a keyboard, a person met before the tab
      # was closed. Every check in it is the regression test for a bug recorded
      # in docs/BUGS.md, and each one failed against the code before its fix.
      - name: Interruptions and reloads (regression suite)
        id: deep
        continue-on-error: true
        run: |
          timeout 240 godot --headless --path . res://tests/deep.tscn > deep.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 124 ]; then
            echo "deep: TIMEOUT — a regression check never returned" >> deep.txt
          fi
          cat deep.txt
          exit $STATUS

      - name: Publish the regression suite
        if: always()
        run: |
          [ -f deep.txt ] || exit 0
          CLEAN=/tmp/deep.clean
          sed 's/\x1b\[[0-9;]*m//g' deep.txt > "$CLEAN"
          if [ "${{ steps.deep.outcome }}" = "success" ]; then
            grep -a "deep: PASS" "$CLEAN" | head -1 \
              | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
            exit 0
          fi
          grep -av "cannot connect to daemon\|_fs_changed\|tcp:5037\|first_scan_filesystem" "$CLEAN" \
            | grep -aE "FAIL|ERROR|Error|error:|Invalid|Cannot|Attempt|deep:" \
            | awk '!seen[$0]++' \
            | head -18 \
            | tr '\n' '|' | cut -c1-3000 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done

      # One joined annotation, not a tail: the playthrough prints ~40 "ok" lines
      # and GitHub keeps only ~10 annotations per run, so a tail spends the quota
      # on passing assertions and the actual FAIL scrolls out of view.
      # Split by outcome on purpose. Emitting ::error:: under `if: always()` put
      # a red annotation on a green run — the PASS line itself arrived as a
      # failure, which trains everybody to ignore the red ones.
      - name: Publish the playthrough pass
        if: steps.smoke.outcome == 'success'
        run: |
          [ -f smoke.txt ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' smoke.txt \
            | grep -a "smoke: PASS" | head -1 \
            | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done

      - name: Publish smoke failures as one annotation
        if: steps.smoke.outcome != 'success'
        run: |
          [ -f smoke.txt ] || exit 0
          CLEAN=/tmp/smoke.clean
          sed 's/\x1b\[[0-9;]*m//g' smoke.txt > "$CLEAN"
          # Match everything that could EXPLAIN a failure, not only lines that
          # contain the word FAIL. Godot reports a missing property as "Invalid
          # get index", a broken script as a bare "Compile Error", and a null
          # call as "Attempt to call function ... on a null value" — the first
          # run of this test failed a single assertion and its own annotation
          # filtered the reason out, which cost a whole CI cycle to discover.
          # awk-dedupe before the head: one repeated runtime error printed seven
          # times pushed the assertions that actually named the bug out of the
          # 3000-character annotation. Order is preserved, unlike sort -u.
          grep -av "cannot connect to daemon\|_fs_changed\|tcp:5037\|first_scan_filesystem" "$CLEAN" \
            | grep -aE "FAIL|ERROR|Error|error:|Invalid|Cannot|Attempt|diag|smoke:" \
            | awk '!seen[$0]++' \
            | head -14 \
            | tr '\n' '|' | cut -c1-3000 \
            | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          # And the head of the run as context: when a test stops early, the
          # checks that PASSED first are what narrow down where it stopped.
          head -24 "$CLEAN" \
            | tr '\n' '|' | cut -c1-3000 \
            | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done

      # Raw CI logs live on a host this project's authoring sandbox cannot
      # reach; check-run annotations come from api.github.com and can. But
      # GitHub keeps only ~10 annotations per run, and Godot prints ANSI-coloured
      # progress lines after the error — so an unfiltered tail fills the quota
      # with noise and the actual failure disappears. Strip ANSI, drop the
      # progress spam, dedupe, and spend the quota on error lines first.
      - name: Publish failure output as annotations
        if: always()
        run: |
          for F in lint.txt export.txt; do
            [ -f "$F" ] || continue
            # Each error line plus the five that follow it: Godot lists the
            # actual reasons UNDER "due to configuration errors", and filtering
            # to matching lines only ever showed the header.
            sed 's/\x1b\[[0-9;]*m//g' "$F" \
              | grep -av "first_scan_filesystem\|^\[ *[0-9]*% \]" \
              | grep -av "cannot connect to daemon\|_fs_changed\|tcp:5037" \
              | awk 'BEGIN{k=0} /ERROR|Parse Error|Cannot|Failed|FAIL|error:/{k=6} k>0{print;k--}' \
              | head -8 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            sed 's/\x1b\[[0-9;]*m//g' "$F" | tail -n 2 \
              | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          done

      - name: Fail the job if the lint failed
        if: steps.lint.outcome != 'success'
        run: |
          echo "content lint failed"
          exit 1

      - name: Fail the job if the playthrough failed
        if: steps.smoke.outcome != 'success'
        run: |
          echo "the headless playthrough did not complete"
          exit 1

      - name: Fail the job if the regression suite failed
        if: steps.deep.outcome != 'success'
        run: |
          echo "an interruption or reload regression check failed"
          exit 1

  # ── rendered frames: the one capability the headless suites cannot have ──
  # The three GDScript suites run --headless, where Godot has no rendering
  # device and get_viewport().get_texture() cannot produce a picture. This job
  # runs the SAME project under Xvfb with Mesa's software OpenGL driver, boots
  # the shipped Main.tscn, plays beats through the engine's input pipeline and
  # saves real framebuffer captures. The PNGs come back to the authoring
  # sandbox as base64 check-run annotations, because artifacts and raw logs
  # live on hosts that sandbox cannot reach (tools/decode_frames.py).
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 (hosted runners can reach GitHub releases)
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          GODOT=$(find /tmp/godot-bin -type f -name 'Godot_v4.7.2*' | head -1)
          cp "$GODOT" /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version

      - name: Install Xvfb and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libxcursor1 \
            libxinerama1 libxi6 libxrandr2 mesa-utils fontconfig || true

      - name: Import resources and build the global class cache
        run: /tmp/godot --headless --path . --import || true

      - name: Render real gameplay frames (Xvfb + llvmpipe)
        id: render
        continue-on-error: true
        run: |
          mkdir -p build/frames
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot --path . --rendering-driver opengl3 --audio-driver Dummy \
            res://tests/visual.tscn > visual.txt 2>&1
          STATUS=$?
          cat visual.txt
          echo "render exit=$STATUS"
          exit $STATUS

      - name: Console and runtime error gate
        if: always()
        run: |
          if [ ! -f visual.txt ]; then echo "::warning::no visual log"; exit 0; fi
          # Godot prints "ERROR: N resources still in use at exit" while
          # tearing down a scene booted from the command line. That is engine
          # housekeeping, not a script or runtime failure; everything else
          # named here is a real one.
          BAD=$(grep -aE "SCRIPT ERROR|Parse Error|ERROR:|Failed to load script|Invalid get index|null instance|Attempt to call function|Could not resolve" visual.txt \
            | grep -av "resources still in use at exit" | head -20 || true)
          if [ -n "$BAD" ]; then
            printf '%s\n' "$BAD" | tr '\n' '|' | cut -c1-3000 \
              | while IFS= read -r l; do printf '::error::%s\n' "$l"; done
            exit 1
          fi
          echo "visual: no script or runtime errors in the render log"

      # The harness's own verdict and every failed assertion, as annotations:
      # raw job logs live on a host the authoring sandbox cannot reach.
      - name: Publish the harness verdict
        if: always()
        run: |
          if [ -f visual.txt ]; then
            grep -aE '  FAIL|visual: PASS|visual: [0-9]+ FAILURE' visual.txt | head -4 \
              | while IFS= read -r l; do printf '::notice::%s\n' "$l"; done
          fi

      # GitHub TRUNCATES an annotation message at 4096 characters and allows
      # ~10 notices per step. A 320x180 PNG is ~20 KB (27 KB of base64), so
      # each frame is cut into 3800-char chunks, spread round-robin over
      # fourteen short steps. Fourteen keeps the per-step count low now that the
      # harness captures fourteen states — boot control, a 2x Chinese-text
      # review, sheep interaction, quest update, the Goliath duel, the valley
      # after the fall, 4:3 layout and a real fade. ~43 chunks + the notices
      # stays under GitHub's ~50-annotation/check-run cap (verified at 12
      # frames = 37 chunks; 16 frames = 46 chunks). tools/decode_frames.py
      # reassembles by name/index.
      - name: Prepare base64 frame chunks
        if: always()
        env:
          WIC_NP: 14
        run: |
          # A 320x180 truecolour capture is ~20 KB -> ~8 annotation chunks.
          # Quantising to 48 colours keeps it a real, readable pixel frame at
          # ~7 KB, so a whole run fits comfortably inside GitHub's ~50
          # annotation/check-run cap. Pillow is a transport detail only; the
          # engine's own Image class does the in-run regression comparison.
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY'
          import base64, glob, os
          os.makedirs("build/ann", exist_ok=True)
          try:
              from PIL import Image
          except ImportError:
              Image = None
          lines = []
          files = sorted(glob.glob("build/frames/*.png"))
          if not files:
              print("::warning::visual job produced no frames")
          for f in files:
              src = f
              if Image is not None:
                  small = "build/ann/" + os.path.basename(f)[:-4] + ".q.png"
                  Image.open(f).convert("RGB").quantize(colors=48).save(small, optimize=True)
                  src = small
              raw = base64.b64encode(open(src, "rb").read()).decode()
              name = os.path.basename(f)[:-4]
              CH = 3800
              parts = [raw[i:i + CH] for i in range(0, len(raw), CH)]
              for i, part in enumerate(parts):
                  lines.append("::notice::WICFRAME|%s|%d|%d|%s" % (name, i, len(parts), part))
          NP = int(os.environ.get("WIC_NP", "14"))
          buckets = [[] for _ in range(NP)]
          for i, line in enumerate(lines):
              buckets[i % NP].append(line)
          for i, b in enumerate(buckets):
              open("build/ann/part_%d.txt" % i, "w").write("\n".join(b) + ("\n" if b else ""))
          print("prepared %d chunk(s) in %d parts for %d frame(s)" % (len(lines), NP, len(files)))
          PUB = 0
          NEEDLE = "name: Publish frame" + " chunks"
          for line in open(".github/workflows/build-web.yml", encoding="utf-8"):
              PUB += line.count(NEEDLE)
          if PUB < NP:
              raise SystemExit("only %d publish steps for NP=%d — parts would be lost" % (PUB, NP))
          PY

      - name: Publish frame chunks 1/14
        if: always()
        run: |
          [ -f build/ann/part_0.txt ] && cat build/ann/part_0.txt || true
      - name: Publish frame chunks 2/14
        if: always()
        run: |
          [ -f build/ann/part_1.txt ] && cat build/ann/part_1.txt || true
      - name: Publish frame chunks 3/14
        if: always()
        run: |
          [ -f build/ann/part_2.txt ] && cat build/ann/part_2.txt || true
      - name: Publish frame chunks 4/14
        if: always()
        run: |
          [ -f build/ann/part_3.txt ] && cat build/ann/part_3.txt || true
      - name: Publish frame chunks 5/14
        if: always()
        run: |
          [ -f build/ann/part_4.txt ] && cat build/ann/part_4.txt || true
      - name: Publish frame chunks 6/14
        if: always()
        run: |
          [ -f build/ann/part_5.txt ] && cat build/ann/part_5.txt || true
      - name: Publish frame chunks 7/14
        if: always()
        run: |
          [ -f build/ann/part_6.txt ] && cat build/ann/part_6.txt || true
      - name: Publish frame chunks 8/14
        if: always()
        run: |
          [ -f build/ann/part_7.txt ] && cat build/ann/part_7.txt || true
      - name: Publish frame chunks 9/14
        if: always()
        run: |
          [ -f build/ann/part_8.txt ] && cat build/ann/part_8.txt || true
      - name: Publish frame chunks 10/14
        if: always()
        run: |
          [ -f build/ann/part_9.txt ] && cat build/ann/part_9.txt || true
      - name: Publish frame chunks 11/14
        if: always()
        run: |
          [ -f build/ann/part_10.txt ] && cat build/ann/part_10.txt || true
      - name: Publish frame chunks 12/14
        if: always()
        run: |
          [ -f build/ann/part_11.txt ] && cat build/ann/part_11.txt || true
      - name: Publish frame chunks 13/14
        if: always()
        run: |
          [ -f build/ann/part_12.txt ] && cat build/ann/part_12.txt || true
      - name: Publish frame chunks 14/14
        if: always()
        run: |
          [ -f build/ann/part_13.txt ] && cat build/ann/part_13.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames
          path: build/frames
          if-no-files-found: ignore

      - name: Fail the job if rendering failed
        if: steps.render.outcome != 'success'
        run: |
          echo "rendered-frame harness failed; see the annotations above"
          exit 1

  # ── export the web build ─────────────────────────────────────────────────
  export-web:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Export templates into place
        run: |
          # The image has moved its template directory between releases, and a
          # missing template dir surfaces only as a vague "configuration
          # errors" at export time. So search the usual locations, link
          # whatever is there, and report exactly what was found.
          TARGET="$HOME/.local/share/godot/export_templates"
          mkdir -p "$TARGET"
          for SRC in /root/.local/share/godot/export_templates \
                     /usr/local/share/godot/export_templates \
                     /opt/godot/export_templates \
                     /home/runner/.local/share/godot/export_templates; do
            [ -d "$SRC" ] || continue
            for V in "$SRC"/*; do
              [ -d "$V" ] || continue
              N=$(basename "$V")
              if [ ! -e "$TARGET/$N" ]; then
                ln -s "$V" "$TARGET/$N" 2>/dev/null || cp -r "$V" "$TARGET/$N" || true
              fi
            done
          done
          echo "::notice::godot version: $(godot --version 2>/dev/null | head -1)"
          echo "::notice::template dirs: $(ls "$TARGET" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::web template files: $(ls "$TARGET/${GODOT_VERSION}.stable" 2>/dev/null | grep -c web || echo 0)"

      - name: Install build deps (fontconfig for Godot, python3 for tools)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache fontconfig ttf-dejavu python3 || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq || true
            apt-get install -y -qq --no-install-recommends \
              fontconfig python3 || true
          fi
          echo "python3: $(command -v python3 || echo MISSING)"

      - name: Import resources and build the global class cache
        run: |
          # --import does a full headless import and exits; --editor --quit can
          # bail during the first filesystem scan, leaving
          # .godot/global_script_class_cache.cfg unwritten. Without that cache a
          # class_name cannot be resolved from another script, which surfaces as
          # "Could not resolve external class member" in an unrelated file.
          godot --headless --import || godot --headless --editor --quit || true
          if [ -f .godot/global_script_class_cache.cfg ]; then
            echo "::notice::global class cache present ($(grep -c '"class":' .godot/global_script_class_cache.cfg 2>/dev/null || echo 0) entries)"
          else
            echo "::warning::global_script_class_cache.cfg was not written"
          fi

      # Boots the real project headless: autoloads registered, global classes
      # resolved, main scene instantiated. A per-file --check-only run cannot do
      # this, and drowned in cascade errors from unregistered autoloads.
      - name: Boot the project headless (parse + smoke check)
        run: sh tools/ci_bootcheck.sh 10

      - name: Export Web (single-threaded, gl_compatibility)
        id: export
        continue-on-error: true
        run: |
          mkdir -p build/web
          godot --headless --export-release "${EXPORT_PRESET}" build/web/index.html > export.txt 2>&1
          STATUS=$?
          cat export.txt
          exit $STATUS

      # Raw CI logs live on a host this project's authoring sandbox cannot
      # reach; check-run annotations come from api.github.com and can. But
      # GitHub keeps only ~10 annotations per run, and Godot prints ANSI-coloured
      # progress lines after the error — so an unfiltered tail fills the quota
      # with noise and the actual failure disappears. Strip ANSI, drop the
      # progress spam, dedupe, and spend the quota on error lines first.
      - name: Publish failure output as annotations
        if: always()
        run: |
          for F in lint.txt export.txt; do
            [ -f "$F" ] || continue
            # Each error line plus the five that follow it: Godot lists the
            # actual reasons UNDER "due to configuration errors", and filtering
            # to matching lines only ever showed the header.
            sed 's/\x1b\[[0-9;]*m//g' "$F" \
              | grep -av "first_scan_filesystem\|^\[ *[0-9]*% \]" \
              | grep -av "cannot connect to daemon\|_fs_changed\|tcp:5037" \
              | awk 'BEGIN{k=0} /ERROR|Parse Error|Cannot|Failed|FAIL|error:/{k=6} k>0{print;k--}' \
              | head -8 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            sed 's/\x1b\[[0-9;]*m//g' "$F" | tail -n 2 \
              | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          done

      - name: Fail the job if the export failed
        if: steps.export.outcome != 'success'
        run: |
          echo "web export failed"
          exit 1

      # Godot writes the .pck and exits 0 even when a script inside it does not
      # parse, so a green export can still ship a game that black-screens.
      - name: Refuse to publish a build containing unparseable scripts
        run: |
          if [ -f export.txt ] && grep -aqE "Parse Error|Failed to load script" export.txt; then
            sed 's/\x1b\[[0-9;]*m//g' export.txt \
              | grep -aE "Parse Error|Failed to load script|Could not resolve" \
              | head -20 | tr '\n' '|' | cut -c1-3000 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            echo "export contains script parse errors"
            exit 1
          fi
          echo "export contains no script parse errors"

      - name: Verify PWA (engine-native service worker + manifest)
        env:
          WIC_BUILD_STAMP: ${{ github.sha }}
        run: |
          python3 tools/inject_pwa.py build/web > inject.txt 2>&1
          STATUS=$?
          cat inject.txt
          exit $STATUS

      - name: Publish build summary as annotations
        if: always()
        run: |
          for F in inject.txt; do
            [ -f "$F" ] || continue
            while IFS= read -r line; do printf '::notice::%s\n' "$line"; done < "$F"
          done
          ls build/web | while IFS= read -r f; do
            printf '::notice::artifact %s (%s KB)\n' "$f" \
              "$(du -sk "build/web/$f" | cut -f1)"
          done

      - name: Size budget (fail over 80 MB; pixel art should keep this ~10-20 MB)
        run: |
          # busybox/coreutils du differs, so budget in kilobytes (80 MB = 81920 KB)
          KB=$(du -sk build/web | cut -f1)
          echo "web export: ${KB} KB"
          ls -la build/web
          if [ "$KB" -gt 81920 ]; then
            echo "::error::web export is ${KB} KB, over the 80 MB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  # ── real browser validation ──────────────────────────────────────────────
  # Godot headless tests do not prove the exported WASM game boots. This job
  # serves the ACTUAL web artifact over a local HTTP server and opens it in a
  # real Chromium (Playwright), driving keyboard, mouse and touch, reading the
  # IndexedDB save, checking WebGL/WebAudio and photographing five layouts.
  # Screenshots and the structured log come back as check-run annotations so
  # the authoring sandbox — which cannot reach the artifact host — can review
  # them with tools/decode_browser_frames.py.
  browser:
    needs: export-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIC_NB: 12
      WIC_STRICT: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Install Playwright + Chromium
        run: |
          npm install --prefix /tmp/wicpw --no-audit --no-fund playwright
          /tmp/wicpw/node_modules/.bin/playwright install --with-deps chromium
          node -e "console.log('playwright', require('/tmp/wicpw/node_modules/playwright/package.json').version)"

      - name: Serve the export and open it in Chromium
        env:
          NODE_PATH: /tmp/wicpw/node_modules
          WIC_OUT: build/browser
          WIC_URL: http://127.0.0.1:8080/index.html
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory build/web > build/browser-server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/index.html > /dev/null && break
            sleep 1
          done
          node tests/browser/validate.cjs

      - name: Prepare evidence annotations
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, json, os
          from PIL import Image
          # GitHub keeps only 50 annotations per check run. Small quantised
          # thumbnails + a compact log keep the whole evidence set under it.
          os.makedirs("build/browser/ann", exist_ok=True)
          CH = 3800
          lines = []
          from PIL import ImageDraw
          allfiles = {os.path.basename(f)[:-4]: f for f in glob.glob("build/browser/shots/*.png")}
          # One contact sheet of EVERY frame, then a few full-size key frames.
          names = sorted(allfiles)
          if names:
              CW, CHH, PAD = 160, 100, 4
              cols = 4
              rows = (len(names) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * (CW + PAD) + PAD, rows * (CHH + PAD) + PAD), (16, 22, 28))
              dr = ImageDraw.Draw(sheet)
              for i, n in enumerate(names):
                  im = Image.open(allfiles[n]).convert("RGB")
                  im.thumbnail((CW, CHH - 16), Image.LANCZOS)
                  x = PAD + (i % cols) * (CW + PAD)
                  y = PAD + (i // cols) * (CHH + PAD)
                  sheet.paste(im, (x, y + 16))
                  dr.text((x, y), "%d %s" % (i, n[:26]), fill=(232, 226, 208))
              sheet.save("build/browser/ann/00_contact_sheet.png", optimize=True)
              allfiles["00_contact_sheet"] = "build/browser/ann/00_contact_sheet.png"
          WANT = ["00_contact_sheet", "01_boot_desktop", "06_dialogue_advance_2",
                  "vp_mobile_landscape_844x390", "touch_03_portrait",
                  "goliath_02_duel", "goliath_05_ending"]
          files = [allfiles[n] for n in WANT if n in allfiles]
          if not files:
              print("::warning::browser job produced no screenshots")
          groups = []
          for f in files:
              name = os.path.basename(f)[:-4]
              im = Image.open(f).convert("RGB")
              size = (680, 680) if name == "00_contact_sheet" else (320, 320)
              im.thumbnail(size, Image.LANCZOS)
              im.quantize(colors=16).save("build/browser/ann/" + name + ".png", optimize=True)
              raw = base64.b64encode(open("build/browser/ann/" + name + ".png", "rb").read()).decode()
              parts = [raw[i:i + CH] for i in range(0, len(raw), CH)]
              groups.append((name, ["::notice::WICBROWSER|%s|%d|%d|%s" % (name, i, len(parts), part)
                                    for i, part in enumerate(parts)]))
          # Reserve four lines for the compact log and short text notices.
          budget = 44
          for name, chunks in groups:
              if len(lines) + len(chunks) > budget:
                  print("::warning::dropping %s (%d chunks) to stay under the annotation cap" % (name, len(chunks)))
                  continue
              lines += chunks
          lp = "build/browser/log.json"
          if os.path.isfile(lp):
              try:
                  d = json.load(open(lp))
              except Exception as e:
                  print("::warning::browser log.json was unreadable: %s" % e)
                  d = {"fatal": "log.json unreadable: %s" % e}
              compact = {
                  "chromium": d.get("chromium"), "started": d.get("started"),
                  "summary": d.get("summary"), "audio": d.get("audio"),
                  "fatal": (d.get("fatal") or "")[:1500],
                  "checks": [{k: c.get(k) for k in ("name", "ok", "detail")} for c in d.get("checks", [])],
                  "console": d.get("console", [])[:20],
                  "pageErrors": d.get("pageErrors", [])[:10],
                  "requests": d.get("requests", [])[:10],
                  "notes": [str(t)[:300] for t in d.get("notes", [])],
                  "views": [{"tag": v.get("tag"), "canvas": v.get("state", {}).get("canvas"),
                             "rotationOverlay": v.get("state", {}).get("rotationOverlay"),
                             "draws": (v.get("state", {}).get("wic") or {}).get("draws")}
                            for v in d.get("views", [])],
                  "saves": {k: {"databases": v.get("databases"),
                                "files": [{"db": x.get("db"), "store": x.get("store"), "key": x.get("key"),
                                           "shape": x.get("shape"), "raw": (x.get("raw") or "")[:300]}
                                          for x in v.get("files", [])]}
                            for k, v in d.get("saves", {}).items()},
                  "goliath": (lambda g: {"presses": g.get("presses"), "won": g.get("won"),
                                         "ended": g.get("ended"), "fallbackEnded": g.get("fallbackEnded"),
                                         "fallbackTalked": g.get("fallbackTalked"),
                                         "fallbackPresses": g.get("fallbackPresses"),
                                         "finalProgress": (g.get("finalSave") or {}).get("progress"),
                                         "finalFlags": (g.get("finalSave") or {}).get("flags")} if g else None)(d.get("goliath")),
              }
              blob = json.dumps(compact, separators=(",", ":"), ensure_ascii=False).encode()
              open("build/browser/ann/compact-log.json", "wb").write(blob)
              raw = base64.b64encode(blob).decode()
              parts = [raw[i:i + CH] for i in range(0, len(raw), CH)]
              for i, part in enumerate(parts):
                  lines.append("::notice::WICBROWSERLOG|%d|%d|%s" % (i, len(parts), part))
              s = compact.get("summary") or {}
              texts = ["::notice::WICBROWSERTEXT|chromium=%s checks=%s failed=%s consoleErrors=%s pageErrors=%s" %
                       (compact.get("chromium"), s.get("checks"), s.get("failedChecks"),
                        s.get("consoleErrors"), s.get("pageErrors"))]
              if compact.get("fatal"):
                  texts.append("::notice::WICBROWSERTEXT|FATAL %s" % compact["fatal"][:900].replace("\n", " "))
              g = compact.get("goliath") or {}
              texts.append("::notice::WICBROWSERTEXT|DUEL presses=%s won=%s ending=%s corin=%s endingPresses=%s finalAct=%s" %
                           (g.get("presses"), g.get("won"), g.get("fallbackEnded"), g.get("fallbackTalked"),
                            g.get("fallbackPresses"), (g.get("finalProgress") or {}).get("act")))
              for c in [x for x in compact["checks"] if not x.get("ok")][:4]:
                  texts.append("::notice::WICBROWSERTEXT|FAILED %s -- %s" % (c.get("name"), c.get("detail")))
              for c in compact["console"][:3]:
                  texts.append("::notice::WICBROWSERTEXT|CONSOLE %s %s" % (c.get("type"), str(c.get("text"))[:220]))
              for t in compact["notes"][:3]:
                  texts.append("::notice::WICBROWSERTEXT|NOTE %s" % t)
          else:
              texts = []
          # 50 annotations per check run. Keep all image/log chunks, spend the
          # remainder on short text lines.
          head_count = len(lines)
          lines += texts[:max(0, 49 - head_count)]
          print("evidence: %d image/log chunks + %d text lines (cap 49)" % (head_count, len(lines) - head_count))
          NB = int(os.environ.get("WIC_NB", "12"))
          buckets = [[] for _ in range(NB)]
          for i, line in enumerate(lines):
              buckets[i % NB].append(line)
          for i, b in enumerate(buckets):
              open("build/browser/ann/part_%d.txt" % i, "w").write("\n".join(b) + ("\n" if b else ""))
          print("prepared %d chunk(s) in %d parts for %d screenshot(s)" % (len(lines), NB, len(files)))
          PUB = 0
          NEEDLE = "name: Publish browser" + " chunk"
          for line in open(".github/workflows/build-web.yml", encoding="utf-8"):
              PUB += line.count(NEEDLE)
          if PUB < NB:
              raise SystemExit("only %d publish steps for NB=%d - evidence would be lost" % (PUB, NB))
          PY

      - name: Publish browser chunk 1/12
        if: always()
        run: '[ -f build/browser/ann/part_0.txt ] && cat build/browser/ann/part_0.txt || true'
      - name: Publish browser chunk 2/12
        if: always()
        run: '[ -f build/browser/ann/part_1.txt ] && cat build/browser/ann/part_1.txt || true'
      - name: Publish browser chunk 3/12
        if: always()
        run: '[ -f build/browser/ann/part_2.txt ] && cat build/browser/ann/part_2.txt || true'
      - name: Publish browser chunk 4/12
        if: always()
        run: '[ -f build/browser/ann/part_3.txt ] && cat build/browser/ann/part_3.txt || true'
      - name: Publish browser chunk 5/12
        if: always()
        run: '[ -f build/browser/ann/part_4.txt ] && cat build/browser/ann/part_4.txt || true'
      - name: Publish browser chunk 6/12
        if: always()
        run: '[ -f build/browser/ann/part_5.txt ] && cat build/browser/ann/part_5.txt || true'
      - name: Publish browser chunk 7/12
        if: always()
        run: '[ -f build/browser/ann/part_6.txt ] && cat build/browser/ann/part_6.txt || true'
      - name: Publish browser chunk 8/12
        if: always()
        run: '[ -f build/browser/ann/part_7.txt ] && cat build/browser/ann/part_7.txt || true'
      - name: Publish browser chunk 9/12
        if: always()
        run: '[ -f build/browser/ann/part_8.txt ] && cat build/browser/ann/part_8.txt || true'
      - name: Publish browser chunk 10/12
        if: always()
        run: '[ -f build/browser/ann/part_9.txt ] && cat build/browser/ann/part_9.txt || true'
      - name: Publish browser chunk 11/12
        if: always()
        run: '[ -f build/browser/ann/part_10.txt ] && cat build/browser/ann/part_10.txt || true'
      - name: Publish browser chunk 12/12
        if: always()
        run: '[ -f build/browser/ann/part_11.txt ] && cat build/browser/ann/part_11.txt || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: build/browser

  # ── publish to GitHub Pages ──────────────────────────────────────────────
  # Creating a Pages site requires repository admin, which neither this
  # workflow's GITHUB_TOKEN nor an automated agent token is granted:
  # "Create Pages site failed. Error: Resource not accessible by integration".
  # So the one-time switch is manual — Settings → Pages → Source: GitHub
  # Actions — and until it is flipped this job stays green, publishes nothing,
  # and says exactly what to do. The build artifact is uploaded regardless, so
  # the game is playable locally in the meantime.
  deploy:
    needs: export-web
    # `main` is the release. The named working branch is an opt-in PREVIEW: the
    # repo's `github-pages` environment has a custom deployment-branch policy
    # that lists it, so `actions/deploy-pages` is accepted from this ref.
    # There is ONE Pages site per repo, so a preview deploy temporarily replaces
    # the live URL with the branch build; the next `main` push (or the merge)
    # republishes main. Any other branch added here must also be added to that
    # environment policy, or its deploy job will fail.
    #
    # Never switch Source to "Deploy from a branch" to get a preview: that makes
    # Pages Jekyll-build the repository ROOT and serve README.md instead of the
    # game. It happened on 2026-11-06 (pages build 1345363804) and is why the
    # artifact check below exists. `build_type` must stay `workflow`.
    # `main` publishes automatically. A working branch publishes ONLY when a
    # human explicitly asks for it via workflow_dispatch with publish_preview
    # checked. Every ordinary push (including the validation pushes for this
    # milestone) builds and browser-tests without touching the live Pages site.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Verify the artifact is the game, not repository text
        run: |
          if [ ! -f build/web/index.html ]; then
            echo "::error::web artifact has no index.html — refusing to publish repository text"
            exit 1
          fi
          if ! grep -q "serviceWorker" build/web/index.html; then
            echo "::error::web artifact index.html is not the PWA-injected Godot build"
            exit 1
          fi
          echo "web artifact verified: index.html with a registered service worker"

      - name: Report the publish target
        env:
          WIC_REF: ${{ github.ref_name }}
          WIC_SHA: ${{ github.sha }}
        run: |
          echo "::notice::Publishing $WIC_REF @ $WIC_SHA to https://fongway94.github.io/WalkInCovenant/ . A push to main republishes main."

      - id: pages
        name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Report that Pages needs a one-time switch
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled on this repository, so nothing was published."
          echo "::notice::Fix once: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then re-run this workflow."
          echo "::notice::Meanwhile the 'web' artifact holds the full build: unzip it and run 'python3 -m http.server 8080' inside, then open http://localhost:8080."

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
