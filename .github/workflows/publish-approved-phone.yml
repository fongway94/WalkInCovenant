# One-time public phone playtest, explicitly approved by the user.
# Remove this workflow after deployment; ordinary branch pushes do not publish.
name: Publish approved phone playtest

on:
  push:
    branches: [arena/905f79d4-walkincovenant]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# This publishes an already-tested artifact, not the artifact from this push.
concurrency:
  group: approved-phone-playtest-0fb4c82
  cancel-in-progress: false

jobs:
  publish:
    # The commit hook can append co-author trailers, so match the subject.
    if: github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Publish validated phone playtest 0fb4c82')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tested revision and CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED=0fb4c8279b106b845a5b82df2519a3b782846821
          git merge-base --is-ancestor "$TESTED" "$GITHUB_SHA"
          CHANGED=$(git diff --name-only "$TESTED" "$GITHUB_SHA")
          test "$CHANGED" = '.github/workflows/publish-approved-phone.yml'
          FACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43371609984" \
            --jq '[.head_sha, .head_branch, .status, .conclusion] | @tsv')
          EXPECTED=$(printf '%s\t%s\t%s\t%s' "$TESTED" \
            'arena/905f79d4-walkincovenant' 'completed' 'success')
          test "$FACTS" = "$EXPECTED"
          echo 'Verified: the game is unchanged from the fully passing CI run.'

      - name: Download the previously verified release build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web
          run-id: 43371609984
          github-token: ${{ github.token }}

      - name: Verify the artifact is the production game
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          grep -q 'serviceWorker' build/web/index.html
          grep -Fq '+0fb4c82' build/web/index.service.worker.js
          python3 tools/check_pack_contents.py release build/web/index.pck
          PCK_SHA=$(sha256sum build/web/index.pck | cut -d' ' -f1)
          echo "::notice::APPROVED_GAME_PCK_SHA256|$PCK_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/web

      - id: deployment
        name: Deploy the approved build
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000

      - name: Check the public game and cache version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
            --max-time 30 -fsSL -H 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/index.html?verified=0fb4c82" > /tmp/game.html
          curl --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
            --max-time 30 -fsSL -H 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/index.service.worker.js?verified=0fb4c82" > /tmp/game-worker.js
          grep -q 'serviceWorker' /tmp/game.html
          grep -Fq '+0fb4c82' /tmp/game-worker.js
          curl --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
            --max-time 180 -fsSL -H 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/index.pck?verified=0fb4c82" > /tmp/game.pck
          cmp build/web/index.pck /tmp/game.pck
          PCK_SHA=$(sha256sum /tmp/game.pck | cut -d' ' -f1)
          echo "::notice::PUBLIC_PLAYTEST_OK|$PAGE_URL|0fb4c82|$PCK_SHA|pck matches tested artifact"

      - name: Install a browser for the public-site check
        run: |
          npm install --prefix /tmp/wicpw --no-audit --no-fund playwright
          /tmp/wicpw/node_modules/.bin/playwright install --with-deps chromium

      - name: Play-check the public build in Chromium
        env:
          NODE_PATH: /tmp/wicpw/node_modules
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          WIC_OUT: build/public-browser
          WIC_STRICT: '1'
        run: WIC_URL="${PAGE_URL%/}/index.html" timeout 600 node tests/browser/validate.cjs

      - name: Report the public-browser verdict
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          path = 'build/public-browser/log.json'
          if not os.path.exists(path):
              print('::warning::No public-browser verdict was produced')
          else:
              with open(path, encoding='utf-8') as f:
                  result = json.load(f)
              summary = result.get('summary', {'fatal': result.get('fatal', 'no summary')})
              print('::notice::PUBLIC_BROWSER_VERDICT|' + json.dumps(summary, separators=(',', ':')))
          PYCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-phone-public-browser-evidence
          path: build/public-browser
          if-no-files-found: warn
