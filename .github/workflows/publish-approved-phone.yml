# One-time public phone playtest, explicitly requested by the user.
# Remove this workflow after deployment; normal branch pushes do not publish.
name: Publish approved phone playtest

on:
  push:
    branches: [arena/905f79d4-walkincovenant]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# The earlier build-web run cannot deploy: its lint job failed and export-web
# was skipped. This separate group avoids waiting for its unrelated jobs.
concurrency:
  group: approved-phone-playtest-b134e10
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish validated phone playtest b134e10'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify the tested revision and CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED=b134e10ce1072ca843abd324f1a07ff79d19ad65
          CHANGED=$(git diff --name-only "$TESTED" "$GITHUB_SHA")
          test "$CHANGED" = '.github/workflows/publish-approved-phone.yml'
          FACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43026072545" \
            --jq '[.head_sha, .head_branch, .status, .conclusion] | @tsv')
          EXPECTED=$(printf '%s\t%s\t%s\t%s' "$TESTED" \
            'arena/905f79d4-walkincovenant' 'completed' 'success')
          test "$FACTS" = "$EXPECTED"
          echo 'Verified: the game is unchanged from the fully passing CI run.'

      - name: Download the previously verified release build
        uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web
          run-id: 43026072545
          github-token: ${{ github.token }}

      - name: Verify the artifact is the production game
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          grep -q 'serviceWorker' build/web/index.html
          grep -Fq '+b134e10' build/web/index.service.worker.js
          python3 tools/check_pack_contents.py release build/web/index.pck

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/web

      - id: deployment
        name: Deploy the approved build
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000

      - name: Check the public game and cache version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
            --max-time 30 -fsSL -H 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/index.html?verified=b134e10" > /tmp/game.html
          curl --retry 4 --retry-delay 5 --retry-all-errors --connect-timeout 15 \
            --max-time 30 -fsSL -H 'Cache-Control: no-cache' \
            "${PAGE_URL%/}/index.service.worker.js?verified=b134e10" > /tmp/game-worker.js
          grep -q 'serviceWorker' /tmp/game.html
          grep -Fq '+b134e10' /tmp/game-worker.js
          echo "::notice::PUBLIC_PLAYTEST_OK|$PAGE_URL|b134e10"
