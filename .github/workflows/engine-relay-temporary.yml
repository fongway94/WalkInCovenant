# One-shot transport of the CI Godot executable and Web template to the
# restricted development sandbox. These are unreferenced Git blobs, not a
# deployment or build artifact committed to the repository.
name: temporary-engine-relay

on:
  push:
    branches: ['arena/905f79d4-walkincovenant']

jobs:
  relay:
    if: contains(github.event.head_commit.message, '[engine-relay-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    permissions:
      contents: write
    steps:
      - name: Install transport prerequisites
        run: |
          if command -v apk >/dev/null 2>&1; then apk add --no-cache python3 tar gzip; fi
          if command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq python3 tar gzip; fi
      - name: Package and relay the engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ENGINE=$(command -v godot)
          echo "::notice::ENGINE_INFO|$(godot --version)|$(ls -lh "$ENGINE")"
          python3 - <<'PY'
          import base64, glob, gzip, hashlib, json, os, pathlib, shutil, subprocess, sys, urllib.error, urllib.request
          try:
              engine = pathlib.Path(os.path.realpath(shutil.which('godot')))
              with open(engine, 'rb') as src, gzip.open('/tmp/native-godot.gz', 'wb', compresslevel=6) as dst:
                  shutil.copyfileobj(src, dst)
              candidates = []
              for base in ['/root/.local/share/godot/export_templates', '/usr/local/share/godot/export_templates', '/opt/godot/export_templates', '/home/runner/.local/share/godot/export_templates']:
                  candidates += glob.glob(base + '/**/web_nothreads_release.zip', recursive=True)
              if not candidates:
                  raise RuntimeError('single-threaded Web export template not found')
              template = pathlib.Path(candidates[0])
              reports = {}
              for label, path in [('native', pathlib.Path('/tmp/native-godot.gz')), ('template', template)]:
                  data = path.read_bytes()
                  parts = []
                  for start in range(0, len(data), 18 * 1024 * 1024):
                      chunk = data[start:start + 18 * 1024 * 1024]
                      payload = json.dumps({'content': base64.b64encode(chunk).decode('ascii'), 'encoding': 'base64'}).encode()
                      req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'walkincovenant-engine-relay'})
                      with urllib.request.urlopen(req, timeout=180) as response:
                          parts.append(json.load(response)['sha'])
                  reports[label] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'parts': parts}
              print('::notice::ENGINE_RELAY|' + json.dumps(reports, separators=(',', ':')))
          except Exception as exc:
              print('::error::ENGINE_RELAY_ERROR|' + str(exc)[:1000])
              sys.exit(1)
          PY
