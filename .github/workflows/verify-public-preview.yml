# TEMPORARY: compare the live Pages site with the published artifact.
#
# The authoring sandbox cannot reach fongway94.github.io, so this runs the
# comparison where the network allows it: download the exact artifact the
# deploy used, hash its PCK, hash the PCK the public site serves, and report
# both as annotations. Triggered only by a commit message containing [verify].
name: verify-public-preview

on:
  push:
    branches: [arena/0854f8bd-walkincovenant]

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN: "43462121260"
  SITE: "https://fongway94.github.io/WalkInCovenant"

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify]')
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifact that was deployed
        uses: actions/download-artifact@v4
        with:
          name: web
          path: artifact/web
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Compare artifact and public files
        run: |
          set -u
          ART=$(sha256sum artifact/web/index.pck | cut -d' ' -f1)
          echo "::notice::artifact index.pck sha256=$ART size=$(stat -c%s artifact/web/index.pck)"
          for f in index.html index.pck sw.js manifest.webmanifest; do
            code=$(curl -s -o /tmp/$f -w '%{http_code}' --max-time 60 "$SITE/$f")
            size=$(stat -c%s /tmp/$f 2>/dev/null || echo 0)
            hdr=$(curl -sI --max-time 60 "$SITE/$f" | tr -d '\r' | grep -iE 'content-length|content-type|content-encoding|last-modified|age:' | paste -sd'; ' -)
            echo "::notice::live $f HTTP $code size=$size | $hdr"
          done
          PUB=$(sha256sum /tmp/index.pck | cut -d' ' -f1)
          echo "::notice::public index.pck sha256=$PUB magic=$(head -c 4 /tmp/index.pck)"
          echo "::notice::artifact html starts: $(head -c 160 artifact/web/index.html | tr -d '\n')"
          echo "::notice::live html starts: $(head -c 160 /tmp/index.html | tr -d '\n')"
          if [ "$ART" = "$PUB" ]; then
            echo "::notice::the live PCK is byte-identical to the reviewed artifact"
          else
            echo "::error::the live PCK differs from the reviewed artifact"
          fi
          cmp -s artifact/web/index.html /tmp/index.html && echo "::notice::the live index.html is byte-identical to the artifact" || echo "::warning::the live index.html differs from the artifact"
          if [ -f /tmp/sw.js ] && cmp -s artifact/web/sw.js /tmp/sw.js; then
            echo "::notice::the live sw.js is byte-identical to the artifact"
          else
            echo "::warning::the live sw.js is missing or differs from the artifact"
          fi
