[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; SINGLE-THREADED. This is the setting that makes the build run on plain
; GitHub Pages and on iOS Safari with no COOP/COEP headers. Threaded web builds
; need cross-origin isolation, which GitHub Pages cannot provide. Do not turn
; this on unless you move to a host that sends those headers.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; ETC2/ASTC for phones — matters for the Android-in-a-webview and mobile
; browser path, and costs nothing here because our art is tiny pixel art.
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
; PWA wiring is injected after export by tools/inject_pwa.py (manifest link +
; service worker registration). Keeping it out of head_include means the
; injected block is the single source of truth and CI verifies it landed.
html/head_include="<style>#wic-rot{position:fixed;inset:0;background:#0b0f14;color:#e8e2d0;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:99;font-family:sans-serif;text-align:center;padding:24px}#wic-rot .g{font-size:56px;line-height:1;animation:wicr 1.8s linear infinite}@keyframes wicr{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}@media (orientation:portrait){#wic-rot.on{display:flex}}</style><div id='wic-rot'><div class='g'>&#10227;</div><div style='font-size:20px;margin:14px 0 6px'>&#35831;&#27178;&#23631;&#28216;&#25103;</div><div style='font-size:12px;opacity:.75;max-width:340px'>Please rotate to landscape &mdash; or tap once and the game will turn itself.</div></div><script>(function(){var o=document.getElementById('wic-rot');function touchy(){return ('ontouchstart' in window)||(navigator.maxTouchPoints>0)}function portrait(){return window.matchMedia('(orientation: portrait)').matches}function upd(){if(portrait()&&touchy()){o.classList.add('on')}else{o.classList.remove('on')}}window.addEventListener('orientationchange',upd);window.addEventListener('resize',upd);if(screen.orientation&&screen.orientation.addEventListener){screen.orientation.addEventListener('change',upd)}upd();o.addEventListener('pointerdown',function(){var d=document.documentElement;var rf=d.requestFullscreen||d.webkitRequestFullscreen;var p=null;try{p=rf?rf.call(d):null}catch(e){p=null}Promise.resolve(p).then(function(){if(screen.orientation&&screen.orientation.lock){return screen.orientation.lock('landscape').catch(function(){})}}).then(function(){upd()}).catch(function(){})});})();</script><script>(function(){if(!('serviceWorker' in navigator))return;window.addEventListener('load',function(){navigator.serviceWorker.getRegistration().then(function(r){if(!r)return;r.update();if(r.waiting){r.waiting.postMessage('update')}});})})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false

; NATIVE PWA. Godot 4.7 writes its own service worker and web manifest at
; export time (<name>.service.worker.js, <name>.manifest.json) and wires the
; registration into index.html itself. That is the mechanism this project uses:
; it is maintained by the engine, it knows every file the loader fetches, and it
; is what makes the build installable and playable offline after first load.
; tools/inject_pwa.py verifies these artifacts landed and only falls back to
; hand-injecting web/sw.js if they are missing.
;
; ensure_cross_origin_isolation_headers stays OFF on purpose: it makes the
; exported loader demand COOP/COEP headers, which GitHub Pages cannot send.
; Single-threaded builds do not need them.
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
; 0 = Fullscreen (enum: Fullscreen,Standalone,Minimal UI,Browser)
progressive_web_app/display=0
; 1 = Landscape (enum: Any,Landscape,Portrait) — the game is landscape-first
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="web/icons/icon-144.png"
progressive_web_app/icon_180x180="web/icons/icon-180.png"
progressive_web_app/icon_512x512="web/icons/icon-512.png"
progressive_web_app/background_color=Color(0.078, 0.125, 0.165, 1)

