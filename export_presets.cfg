[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="art/_preview/*,tools/*,docs/*,review/*,.github/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; SINGLE-THREADED. This is the setting that makes the build run on plain
; GitHub Pages and on iOS Safari with no COOP/COEP headers. Threaded web builds
; need cross-origin isolation, which GitHub Pages cannot provide. Do not turn
; this on unless you move to a host that sends those headers.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; ETC2/ASTC for phones — matters for the Android-in-a-webview and mobile
; browser path, and costs nothing here because our art is tiny pixel art.
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
; PWA wiring is injected after export by tools/inject_pwa.py (manifest link +
; service worker registration). Keeping it out of head_include means the
; injected block is the single source of truth and CI verifies it landed.
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false

; NATIVE PWA. Godot 4.7 writes its own service worker and web manifest at
; export time (<name>.service.worker.js, <name>.manifest.json) and wires the
; registration into index.html itself. That is the mechanism this project uses:
; it is maintained by the engine, it knows every file the loader fetches, and it
; is what makes the build installable and playable offline after first load.
; tools/inject_pwa.py verifies these artifacts landed and only falls back to
; hand-injecting web/sw.js if they are missing.
;
; ensure_cross_origin_isolation_headers stays OFF on purpose: it makes the
; exported loader demand COOP/COEP headers, which GitHub Pages cannot send.
; Single-threaded builds do not need them.
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
; 0 = Fullscreen (enum: Fullscreen,Standalone,Minimal UI,Browser)
progressive_web_app/display=0
; 1 = Landscape (enum: Any,Landscape,Portrait) — the game is landscape-first
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="web/icons/icon-144.png"
progressive_web_app/icon_180x180="web/icons/icon-180.png"
progressive_web_app/icon_512x512="web/icons/icon-512.png"
progressive_web_app/background_color=Color(0.078, 0.125, 0.165, 1)

[preset.1]

name="Android"
