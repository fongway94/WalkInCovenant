[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="art/_preview/*,tools/*,docs/*,review/*,.github/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; SINGLE-THREADED. This is the setting that makes the build run on plain
; GitHub Pages and on iOS Safari with no COOP/COEP headers. Threaded web builds
; need cross-origin isolation, which GitHub Pages cannot provide. Do not turn
; this on unless you move to a host that sends those headers.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; ETC2/ASTC for phones — matters for the Android-in-a-webview and mobile
; browser path, and costs nothing here because our art is tiny pixel art.
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
; PWA wiring is injected after export by tools/inject_pwa.py (manifest link +
; service worker registration). Keeping it out of head_include means the
; injected block is the single source of truth and CI verifies it landed.
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_download/enabled=false

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="art/_preview/*,tools/*,docs/*,review/*,.github/*"
export_path="build/android/WalkInCovenant.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

; Intentionally left unsigned and unfinished: Android export needs a keystore
; and the SDK on a machine you control. Documented in docs/ARCHITECTURE.md §9.
; The one-file-for-WhatsApp workflow this project actually wants on phones is
; the APK, which replaces Covenant's single-file html. See docs/PACKAGING.md.
graphics/opengl_debug=false
command_line/extra_args=""
version/code=1
version/name="0.1.0"
package/unique_name="org.walkincovenant.game"
package/name="WalkInCovenant"
screen/orientation=0
