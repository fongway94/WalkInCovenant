[preset.1.options]

; Intentionally left unsigned and unfinished: Android export needs a keystore
; and the SDK on a machine you control. Documented in docs/ARCHITECTURE.md §9.
; The one-file-for-WhatsApp workflow this project actually wants on phones is
; the APK, which replaces Covenant's single-file html. See docs/PACKAGING.md.
graphics/opengl_debug=false
command_line/extra_args=""
version/code=1
version/name="0.1.0"
package/unique_name="org.walkincovenant.game"
package/name="WalkInCovenant"
screen/orientation=0
