<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Shepherd Field — temporary prototype</title>
  <style>
    html, body, canvas { margin: 0; width: 100%; height: 100%; border: 0; }
    body { overflow: hidden; background: #14202a; color: #fff1ce; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; outline: 0; }
    #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; background: #14202a; z-index: 30; padding: 24px; }
    #status.hidden { display: none; }
    #status h1 { font-size: 23px; font-weight: 600; }
    #status p { max-width: 420px; line-height: 1.5; color: #ded6bd; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 40; align-items: center; justify-content: center; text-align: center; background: #14202a; padding: 28px; }
    @media (orientation: portrait) { body.touch-device #rotate { display: flex; } }
    #touch { display: none; position: fixed; inset: 0; z-index: 20; pointer-events: none; user-select: none; -webkit-user-select: none; --size: clamp(42px, 10vmin, 58px); }
    #touch.visible { display: block; }
    #touch .pad { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); display: grid; grid-template: repeat(3, var(--size)) / repeat(3, var(--size)); gap: 3px; }
    #touch button { pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; border: 1px solid rgba(250, 230, 180, .64); border-radius: 12px; background: rgba(30, 31, 25, .67); color: #fff2cc; box-shadow: 0 2px 8px rgba(0,0,0,.35); font: 600 20px system-ui, sans-serif; }
    #touch button.pressed { background: rgba(146, 115, 63, .9); }
    #touch .up { grid-area: 1 / 2; }
    #touch .left { grid-area: 2 / 1; }
    #touch .right { grid-area: 2 / 3; }
    #touch .down { grid-area: 3 / 2; }
    #touch .count { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom)); min-width: 80px; height: 64px; padding: 0 16px; border-radius: 24px; font-size: 14px; letter-spacing: .05em; }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Shepherd field game"></canvas>
  <div id="status" role="status"><div><h1>Shepherd Field</h1><p id="message">Loading the temporary prototype. The first download is about 19 MB.</p></div></div>
  <div id="rotate"><p>Please turn your phone sideways to play.<br>请横屏游戏。</p></div>
  <div id="touch" aria-label="Touch controls">
    <div class="pad">
      <button class="up" type="button" data-code="ArrowUp" aria-label="Move up">▲</button>
      <button class="left" type="button" data-code="ArrowLeft" aria-label="Move left">◀</button>
      <button class="right" type="button" data-code="ArrowRight" aria-label="Move right">▶</button>
      <button class="down" type="button" data-code="ArrowDown" aria-label="Move down">▼</button>
    </div>
    <button class="count" type="button" data-code="Space" aria-label="Count a nearby sheep">COUNT</button>
  </div>
  <script>
  (() => {
    'use strict';
    // This is the already-tested Web artifact from CI run 42961472919. The
    // blob is temporary and unreferenced; it does not change GitHub Pages or
    // put the generated 19 MB archive into the repository's commit history.
    const url = 'https://api.github.com/repos/fongway94/WalkInCovenant/git/blobs/ba88654340779d89b4b6533f29fb5c1fd5c63eda';
    const expected = '21d9c8f6919acafe358533f3ab875bec42520234f9fdeef68063bd54aeeb0365';
    const required = new Set(['index.js', 'index.wasm', 'index.pck', 'index.audio.worklet.js', 'index.audio.position.worklet.js']);
    const message = document.getElementById('message');
    const canvas = document.getElementById('canvas');
    const touch = document.getElementById('touch');
    const touchDevice = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
    if (touchDevice) document.body.classList.add('touch-device');

    // Read only the required entries from this ordinary (non-ZIP64) archive.
    // Browsers with DecompressionStream support raw DEFLATE directly.
    async function unpack(buffer) {
      const view = new DataView(buffer);
      const bytes = new Uint8Array(buffer);
      let end = buffer.byteLength - 22;
      while (end >= Math.max(0, buffer.byteLength - 65557) && view.getUint32(end, true) !== 0x06054b50) end--;
      if (end < 0 || view.getUint32(end, true) !== 0x06054b50) throw new Error('Invalid preview archive');
      const count = view.getUint16(end + 10, true);
      let offset = view.getUint32(end + 16, true);
      const files = {};
      const decoder = new TextDecoder();
      for (let i = 0; i < count; i++) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error('Invalid preview archive directory');
        const method = view.getUint16(offset + 10, true);
        const compressed = view.getUint32(offset + 20, true);
        const size = view.getUint32(offset + 24, true);
        const nameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const local = view.getUint32(offset + 42, true);
        const name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLength));
        offset += 46 + nameLength + extraLength + commentLength;
        if (!required.has(name)) continue;
        if (view.getUint32(local, true) !== 0x04034b50) throw new Error('Invalid preview archive entry');
        const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
        const data = bytes.subarray(start, start + compressed);
        let unpacked;
        if (method === 0) unpacked = data.slice();
        else if (method === 8) {
          const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          unpacked = new Uint8Array(await new Response(stream).arrayBuffer());
        } else throw new Error('Unsupported preview compression');
        if (unpacked.length !== size) throw new Error('Incomplete preview archive');
        files[name] = unpacked;
      }
      for (const name of required) if (!files[name]) throw new Error('Missing preview file: ' + name);
      return files;
    }

    function setupTouch() {
      if (!touchDevice) return;
      const active = new Map(), counts = new Map();
      function send(code, down) {
        canvas.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
          key: code === 'Space' ? ' ' : code, code, bubbles: true, cancelable: true
        }));
      }
      function release(pointerId) {
        const entry = active.get(pointerId);
        if (!entry) return;
        active.delete(pointerId);
        const remaining = (counts.get(entry.code) || 1) - 1;
        if (remaining <= 0) { counts.delete(entry.code); send(entry.code, false); entry.button.classList.remove('pressed'); }
        else counts.set(entry.code, remaining);
      }
      touch.querySelectorAll('button').forEach(button => {
        button.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          event.preventDefault();
          if (active.has(event.pointerId)) return;
          canvas.focus({preventScroll: true});
          const code = button.dataset.code, count = counts.get(code) || 0;
          active.set(event.pointerId, {code, button});
          counts.set(code, count + 1);
          button.classList.add('pressed');
          try { button.setPointerCapture(event.pointerId); } catch (_) {}
          if (!count) send(code, true);
        });
        button.addEventListener('lostpointercapture', event => release(event.pointerId));
      });
      window.addEventListener('pointerup', event => release(event.pointerId));
      window.addEventListener('pointercancel', event => release(event.pointerId));
      function releaseAll() { for (const id of [...active.keys()]) release(id); }
      window.addEventListener('blur', releaseAll);
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
      touch.classList.add('visible');
    }

    async function launch() {
      if (!window.DecompressionStream || !window.crypto || !crypto.subtle) {
        throw new Error('Please use a recent version of Chrome, Firefox, Edge, or Safari.');
      }
      const response = await fetch(url, {headers: {'Accept': 'application/vnd.github.raw+json'}, credentials: 'omit'});
      if (!response.ok) throw new Error('The preview download is unavailable (HTTP ' + response.status + ').');
      let archive = await response.arrayBuffer();
      // Some proxies ignore the raw media type; accept the API's JSON fallback.
      if (new DataView(archive).getUint32(0, true) !== 0x04034b50) {
        const payload = JSON.parse(new TextDecoder().decode(archive));
        if (!payload.content) throw new Error('The preview download is not an archive.');
        const decoded = atob(payload.content.replace(/\s/g, ''));
        const bytes = new Uint8Array(decoded.length);
        for (let i = 0; i < decoded.length; i++) bytes[i] = decoded.charCodeAt(i);
        archive = bytes.buffer;
      }
      const digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', archive)), b => b.toString(16).padStart(2, '0')).join('');
      if (digest !== expected) throw new Error('The preview download failed its integrity check.');
      message.textContent = 'Preparing the field…';
      const files = await unpack(archive);
      archive = null;

      // Serve the two large engine assets from the verified archive in memory.
      const originalFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        if (input === 'index.wasm' || input === 'index.pck') {
          const data = files[input];
          return Promise.resolve(new Response(data, {headers: {
            'Content-Type': input.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream',
            'Content-Length': String(data.byteLength)
          }}));
        }
        return originalFetch(input, init);
      };
      window.__prototypeWorklets = {};
      for (const name of ['index.audio.worklet.js', 'index.audio.position.worklet.js']) {
        window.__prototypeWorklets[name] = URL.createObjectURL(new Blob([files[name]], {type: 'text/javascript'}));
      }
      let engineSource = new TextDecoder().decode(files['index.js']);
      for (const suffix of ['audio.worklet.js', 'audio.position.worklet.js']) {
        const original = 'return `${loadPath}.' + suffix + '`;';
        if (!engineSource.includes(original)) throw new Error('Unexpected Web engine template.');
        engineSource = engineSource.replace(original, 'return window.__prototypeWorklets["index.' + suffix + '"];');
      }
      const script = document.createElement('script');
      script.src = URL.createObjectURL(new Blob([engineSource], {type: 'text/javascript'}));
      await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not start the Web engine.'));
        document.body.appendChild(script);
      });
      const missing = window.Engine.getMissingFeatures({threads: false});
      if (missing.length) throw new Error('This browser is missing: ' + missing.join(', '));
      const engine = new window.Engine({
        canvas, executable: 'index', canvasResizePolicy: 2, focusCanvas: true,
        serviceWorker: '', persistentPaths: [], emscriptenPoolSize: 8, godotPoolSize: 4,
        args: ['--', '--prototype-browser-probe', '--prototype-width=640'],
        fileSizes: {'index.wasm': files['index.wasm'].byteLength, 'index.pck': files['index.pck'].byteLength}
      });
      const override = new TextEncoder().encode('[application]\nrun/main_scene="res://scenes/proto/ShepherdFieldProto.tscn"\n');
      await engine.preloadFile(override, 'override.cfg');
      await engine.startGame();
      document.getElementById('status').classList.add('hidden');
      setupTouch();
    }
    launch().catch(error => {
      console.error(error);
      message.textContent = 'Could not open this temporary preview: ' + (error.message || error) + ' Please try again or request a new link.';
    });
  })();
  </script>
</body>
</html>
